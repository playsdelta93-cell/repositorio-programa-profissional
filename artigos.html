<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artigos - Programa Profissional</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        header {
            background: #173f67;
            color: white;
            padding: 30px 20px;
        }

        .topo {
            max-width: 1000px;
            margin: auto;
        }

        header h1 {
            margin: 0;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .voltar {
            display: inline-block;
            margin-bottom: 20px;
            color: #173f67;
            text-decoration: none;
            font-weight: bold;
        }

        .arquivo {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .arquivo h2 {
            color: #173f67;
            margin-top: 0;
        }

        .botao {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 16px;
            background: #173f67;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        footer {
            margin-top: 50px;
            padding: 25px;
            background: #173f67;
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <div class="topo">
        <h1>Artigos</h1>
        <p>Repositório do Programa Profissional</p>
    </div>
</header>

<main>

    <a class="voltar" href="index.html">
        ← Voltar para a página inicial
    </a>

    <div class="arquivo">
        <h2>Artigo de exemplo</h2>

        <p><strong>Autor:</strong> Autor de exemplo</p>
        <p><strong>Ano:</strong> 2026</p>
        <p><strong>Tipo:</strong> Artigo científico</p>

        <a class="botao" href="#" target="_blank">
            Abrir PDF
        </a>
    </div>

</main>

<footer>
    <p>Repositório do Programa Profissional</p>
</footer>

</body>
</html>
